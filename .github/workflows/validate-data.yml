name: Validate dashboard data
on:
  push:
    branches: [main]
    paths: ['data.js', 'index.html', 'wishlist.js', 'scripts/**', '.github/workflows/validate-data.yml']
  pull_request:
    paths: ['data.js', 'index.html', 'wishlist.js', 'scripts/**', '.github/workflows/validate-data.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-leak-validation.cjs
      - run: node scripts/test-date-tba.cjs
      - run: node scripts/test-wishlist.cjs
      - name: Validate against previous data
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            node scripts/validate-leaks.cjs --baseline "$BASE_SHA"
          else
            node scripts/validate-leaks.cjs
          fi
