<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gacha Banner Tracker</title>
<link rel="icon" type="image/png" sizes="64x64" href="assets/primogem-favicon.png">
<script defer src="https://cloud.umami.is/script.js" data-website-id="9a27ab70-b7f9-4a97-ad02-49ae5259eb6a"></script>
<style>
  :root {
    --bg: #0f1117;
    --card: #181c26;
    --card-border: #262c3a;
    --text: #e8eaf0;
    --muted: #8a91a3;
    --green: #4caf7d;
    --amber: #e0a93e;
    --red: #e05c5c;
    --gray: #5a617a;
    --current-text: #ffffff;
    --upcoming-text: #9ecbff;
    --leaked-text: #d5b5f5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    padding: 24px;
    min-height: 100vh;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    margin-bottom: 20px;
  }
  h1 { font-size: 1.4rem; font-weight: 600; }
  .site-title { display: flex; align-items: center; gap: 8px; }
  .site-title-icon { width: 30px; height: 30px; object-fit: contain; flex: none; }
  .updated { color: var(--muted); font-size: 0.85rem; }
  .stale-warn {
    background: #3a2a1a; color: #f0b860; border: 1px solid #5a4020;
    padding: 4px 10px; border-radius: 6px; font-size: 0.8rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    grid-auto-rows: 1fr;
    gap: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 16px 18px;
    border-top: 3px solid var(--accent, var(--gray));
    display: flex;
    flex-direction: column;
  }
  .card h2 { font-size: 1.05rem; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 8px; }
  .gicon { width: 22px; height: 22px; border-radius: 5px; flex: none; }
  .ver {
    font-size: 0.72rem; color: var(--muted); background: #222838;
    padding: 2px 8px; border-radius: 10px; white-space: nowrap;
  }
  .banner { margin-top: 12px; }
  .banner-title { font-size: 0.92rem; margin-bottom: 6px; color: var(--current-text); }
  .meta { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
  .days { font-weight: 700; }
  .days.ok { color: var(--green); }
  .days.soon { color: var(--amber); }
  .days.urgent { color: var(--red); }
  .days.ended { color: var(--gray); }
  .days.upcoming { color: #7fb4e8; }
  .days.unknown { color: #9ec7ff; }
  .bar { height: 6px; background: #232938; border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .bar-fill.unknown {
    width: 100%;
    background: repeating-linear-gradient(120deg, #385779 0 8px, #6b9fd5 8px 16px);
    background-size: 28px 100%;
    animation: unknown-slide 1.4s linear infinite;
  }
  @keyframes unknown-slide { to { background-position: 28px 0; } }
  @media (prefers-reduced-motion: reduce) { .bar-fill.unknown { animation: none; } }
  .upcoming { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--card-border); }
  .upcoming h3 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--upcoming-text); margin-bottom: 6px; }
  .upcoming li {
    list-style: none; font-size: 0.85rem; margin-bottom: 4px;
    display: flex; justify-content: space-between; gap: 10px; color: var(--upcoming-text);
  }
  .upcoming .when { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }
  .leaks { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--card-border); }
  .leaks h3 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--leaked-text); margin-bottom: 6px; }
  .leaks li { list-style: none; font-size: 0.85rem; margin-bottom: 9px; color: var(--leaked-text); }
  .leak-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 8px; margin-top: 4px; font-size: 0.73rem; color: var(--muted); }
  .leak-meta a { color: #7fb4e8; }
  .confidence { padding: 2px 6px; border-radius: 4px; background: #232938; }
  .confidence.medium { color: #c4b5fd; }
  .confidence.low { color: #c2c8d2; }
  .confidence.high { color: #93c5fd; }
  .check {
    margin-top: 12px; padding: 10px; background: #2a2030; border: 1px solid #4a3050;
    border-radius: 8px; font-size: 0.85rem; color: #d8a0e8;
  }
  .links { margin-top: auto; padding-top: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
  .links a {
    font-size: 0.78rem; color: #7fb4e8; text-decoration: none;
    background: #1d2433; padding: 3px 10px; border-radius: 6px;
  }
  .links a:hover { background: #243048; }
  .ending-badge {
    font-size: 0.68rem; background: #4a2222; color: #f08080;
    padding: 2px 8px; border-radius: 10px; font-weight: 600;
  }
  .new-badge {
    font-size: 0.68rem; background: #1d3a2a; color: #6fe0a0;
    padding: 2px 8px; border-radius: 10px; font-weight: 600;
  }
  .calendar-section { margin-top: 28px; }
  .calendar-section > h2 {
    font-size: 1.05rem; font-weight: 600; margin-bottom: 12px;
  }
  .cal-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-header h3 { font-size: 0.95rem; font-weight: 600; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-nav button {
    width: 28px; height: 28px; border-radius: 6px; cursor: pointer;
    background: #222838; border: 1px solid var(--card-border); color: var(--text);
    font-size: 1rem; line-height: 1;
  }
  .cal-nav button:hover { background: #2c3550; }
  .cal-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .cal-filter {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.75rem; font-family: inherit; color: var(--muted); cursor: pointer;
    background: #1d2433; border: 1px solid var(--card-border); border-radius: 14px;
    padding: 3px 11px;
  }
  .cal-filter:hover { background: #243048; color: var(--text); }
  .cal-filter.active {
    background: #222d45; color: var(--text); font-weight: 600;
    border-color: var(--chip, #7fb4e8);
  }
  .cal-dows, .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-dow {
    font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); text-align: center; padding: 4px 0;
    border-bottom: 1px solid var(--card-border);
  }
  .cal-week { border-bottom: 1px solid #1f2430; padding-bottom: 5px; align-content: start; }
  .cal-week:last-child { border-bottom: none; padding-bottom: 0; }
  .cal-daynum {
    grid-row: 1; text-align: right; font-size: 0.75rem;
    padding: 4px 6px 3px; min-height: 24px;
    border-left: 1px solid #1f2430;
  }
  .cal-daynum:first-child { border-left: none; }
  .cal-daynum.other { color: var(--gray); opacity: 0.55; }
  .cal-daynum.today { background: #2a3450; border-radius: 4px; font-weight: 700; }
  .cal-bar {
    height: 17px; line-height: 17px; margin: 2px 1px 0;
    padding: 0 6px; font-size: 0.68rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: default;
  }
  .cal-bar.starts { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
  .cal-bar.ends { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
  .cal-bar.unknown-end {
    border-right: 2px dashed currentColor;
    background-image: repeating-linear-gradient(120deg, transparent 0 7px, rgba(255,255,255,0.25) 7px 12px);
  }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; flex: none; }
  #cal-tooltip {
    position: fixed; z-index: 10; display: none;
    background: #1d2433; border: 1px solid #3a4258; border-radius: 8px;
    padding: 8px 10px; font-size: 0.78rem; max-width: 280px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5); pointer-events: none;
  }
  #cal-tooltip .tt-date { color: var(--muted); font-size: 0.7rem; margin-bottom: 5px; }
  #cal-tooltip .tt-row {
    display: flex; align-items: baseline; gap: 6px; margin-top: 3px;
  }
  #cal-tooltip .tt-row .cal-dot { position: relative; top: -1px; }
</style>
<style>
  .wishlist-panel { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px 18px; margin-bottom: 20px; }
  .wishlist-panel h2 { font-size: 1rem; margin-bottom: 8px; }
  .wishlist-panel p, .wishlist-panel label { font-size: .85rem; color: var(--muted); }
  .wish-group { margin: 10px 0; }

  .wish-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .wish-header h2 { display: flex; align-items: center; gap: 9px; margin: 0; }
  .wish-heading-star { color: #ffe09a; }
  #wish-count { color: #ffe09a; background: #342d20; border: 1px solid #51432a; border-radius: 20px; padding: 2px 8px; font-size: .72rem; }
  .wish-filter { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .wish-filter input { appearance: none; position: relative; width: 30px; height: 18px; background: #343c4e; border: 1px solid #505b70; border-radius: 20px; cursor: pointer; }
  .wish-filter input::after { content: ''; position: absolute; width: 12px; height: 12px; top: 2px; left: 2px; background: #e8eaf0; border-radius: 50%; }
  .wish-filter input:checked { background: #80642e; border-color: #cfa34c; }
  .wish-filter input:checked::after { left: 14px; background: #ffe09a; }
  .wish-empty-state { padding: 24px 12px 12px; text-align: center; }
  .wish-empty-state strong { display: block; color: var(--text); margin-bottom: 6px; font-size: .9rem; }
  .wish-tabs { display: flex; gap: 5px; margin-top: 12px; padding: 3px; width: fit-content; max-width: 100%; overflow-x: auto; background: #131822; border: 1px solid #252c3a; border-radius: 9px; }
  .wish-tab { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 6px; padding: 5px 10px; white-space: nowrap; background: transparent; color: var(--muted); font: inherit; font-size: .75rem; cursor: pointer; }
  .wish-tab:hover { color: var(--text); background: #202736; }
  .wish-tab[aria-selected="true"] { color: var(--text); background: #2a3243; box-shadow: 0 1px 4px #0005; }
  .wish-tab[data-wish-tab="live"][aria-selected="true"] { color: #82edb5; }
  .wish-tab[data-wish-tab="soon"][aria-selected="true"] { color: #a9d1ff; }
  .wish-tab-count { min-width: 18px; padding: 1px 5px; border-radius: 9px; background: #171c26; color: currentColor; text-align: center; font-size: .65rem; }
  .wish-tab:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .wish-tab-empty { margin: 13px 3px 2px; color: var(--muted); font-size: .78rem; }
  .wish-clusters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .wish-cluster { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px; min-width: 0; padding: 5px 6px; border: 1px solid #2d3545; border-left: 2px solid var(--accent, #5a617a); border-radius: 9px; background: #141923; }
  .wish-cluster-game { display: inline-flex; align-items: center; gap: 6px; padding: 0 4px 0 1px; color: #b4bbca; font-size: .7rem; font-weight: 700; letter-spacing: .03em; }
  .wish-cluster-game img { width: 20px; height: 20px; border-radius: 5px; }
  .wish-cluster-list { display: flex; flex-wrap: wrap; gap: 5px; padding: 0; list-style: none; }
  .wish-chip { position: relative; display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 3px 7px 3px 3px; border: 1px solid #343d4f; border-radius: 16px; background: linear-gradient(135deg, #252938, #1b202c); box-shadow: inset 0 1px rgba(255,255,255,.04); }
  .wish-chip:hover, .wish-chip:focus-within { border-color: var(--accent, #ffe09a); box-shadow: 0 0 12px color-mix(in srgb, var(--accent, #ffe09a) 18%, transparent); }
  .wish-chip-name { min-width: 0; overflow-wrap: anywhere; font-size: .78rem; font-weight: 600; }
  .wish-chip > .wish-star { flex: none; margin: 0; padding: 3px 5px; border-radius: 50%; }
  .wish-chip-status { flex: none; font-size: .62rem; line-height: 1.35; padding: 1px 5px; border-radius: 9px; color: #b4bbca; background: #2a303e; }
  @media (max-width: 440px) { .wish-cluster { width: 100%; } }
  .wish-chip-status.live { color: #82edb5; background: #1c3c30; }
  .wish-chip-status.scheduled { color: #a9d1ff; background: #243950; }
  .wish-character { display: inline; }
  .wish-star { border: 0; border-radius: 4px; background: transparent; color: var(--muted); padding: 0 3px; margin-left: 2px; font: inherit; font-size: 1rem; line-height: 1.2; cursor: pointer; vertical-align: baseline; }
  .wish-star[aria-pressed="true"] { color: #ffe09a; }
  .wish-star:hover { color: #ffe09a; background: #382d1a; }
  .wish-star:focus-visible, #wish-only:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .cal-bar.wish-match { box-shadow: inset 3px 0 var(--amber); padding-left: 8px; }
  .cal-bar.wish-match { outline: 2px solid #ffe09a; outline-offset: -2px; }
  #wish-status { margin-top: 8px; color: #f0b860; }
  #wish-empty { padding: 16px 0; color: var(--muted); }
  [hidden] { display: none !important; }
  @media (max-width: 440px) { body { padding: 12px; } .grid { grid-template-columns: minmax(0, 1fr); } .card h2 { flex-wrap: wrap; } }
</style>

<header>
  <h1 class="site-title"><img class="site-title-icon" src="assets/primogem.png" alt="">Gacha Banner Tracker</h1>
  <span class="updated" id="updated"></span>
  <span class="stale-warn" id="stale" style="display:none"></span>
</header>
<section class="wishlist-panel" aria-labelledby="wish-heading">
  <div class="wish-header">
    <h2 id="wish-heading"><span class="wish-heading-star" aria-hidden="true">★</span> Character wishlist <span id="wish-count"></span></h2>
    <label class="wish-filter" title="Filter game cards and calendar to wishlisted characters"><input id="wish-only" type="checkbox" aria-label="Wishlisted only — cards and calendar"> Wishlisted only</label>
  </div>
  <div id="wish-list"></div>
  <p id="wish-status" role="status"></p>
</section>
<p id="wish-empty" hidden>No matching game cards. Star a character or turn off “Wishlisted only”.</p>
<div class="grid" id="grid"></div>

<section class="calendar-section">
  <h2>📅 Calendar overview</h2>
  <div class="cal-card">
    <div class="cal-header">
      <h3 id="cal-title"></h3>
      <div class="cal-nav">
        <button id="cal-prev" aria-label="Previous month">‹</button>
        <button id="cal-next" aria-label="Next month">›</button>
      </div>
    </div>
    <div class="cal-filters" id="cal-filters"></div>
    <div class="cal-dows">
      <div class="cal-dow">Sun</div><div class="cal-dow">Mon</div><div class="cal-dow">Tue</div>
      <div class="cal-dow">Wed</div><div class="cal-dow">Thu</div><div class="cal-dow">Fri</div>
      <div class="cal-dow">Sat</div>
    </div>
    <div id="cal-weeks"></div>
  </div>
</section>
<div id="cal-tooltip"></div>

<!-- Load data.js with a unique query so HTTP-served pages never show stale data (no-op on file://) -->
<script>document.write('<script src="data.js?v=' + Date.now() + '"><\/script>')</script>
<script src="wishlist.js"></script>
<script>
(function () {
  const data = window.GACHA_DATA;
  const now = new Date();
  const DAY = 86400000;
  const parse = s => new Date(s + "T00:00:00");
  const fmt = s => parse(s).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const wishlist = window.GachaWishlist.create({
    getItem: key => window.localStorage.getItem(key),
    setItem: (key, value) => window.localStorage.setItem(key, value)
  });
  let wishlistTab = 'live';
  const esc = value => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const allEntries = g => [...(g.banners || []), ...(g.upcoming || []), ...(g.leaks || [])];
  const wishAttrs = entry => `data-wish-ids="${esc((entry.characterIds || []).join(' '))}"`;
  const wishStar = (g, id) => {
    const name = esc(g.characters?.[id] || id);
    return `<button type="button" class="wish-star" data-wish-id="${esc(id)}" data-name="${name}" aria-label="Add ${name} to wishlist" title="Add ${name} to wishlist" aria-pressed="false">☆</button>`;
  };
  const wishName = (g, id) => `<span class="wish-character">${esc(g.characters?.[id] || id)}${wishStar(g, id)}</span>`;
  // IDs define identity; name matching only places controls inside the display title.
  const wishTitle = (g, entry) => {
    const title = entry.title;
    const matches = (entry.characterIds || []).map(id => ({ id, name: g.characters?.[id] }))
      .map(item => ({ ...item, index: item.name ? title.indexOf(item.name) : -1 }))
      .sort((a, b) => a.index - b.index || b.name?.length - a.name?.length);
    let result = '', cursor = 0;
    const remaining = [];
    for (const item of matches) {
      if (item.index < cursor) { remaining.push(item.id); continue; }
      result += esc(title.slice(cursor, item.index)) + wishName(g, item.id);
      cursor = item.index + item.name.length;
    }
    return result + esc(title.slice(cursor)) + remaining.map(id => ' · ' + wishName(g, id)).join('');
  };

  // Pick the single banner a card should show right now. A null/missing end is a
  // genuine unknown end, not a one-day duration. Every dated upcoming entry is a
  // candidate, so it is promoted as soon as its start date arrives even when it
  // has no endDate. Prefer active banners, then the most recently ended banner,
  // then the earliest future banner.
  const pickBanner = g => {
    const cands = [];
    for (const b of (g.banners || [])) cands.push({ ...b, title: b.title, start: b.start, end: b.end ?? null });
    for (const u of (g.upcoming || [])) {
      if (u.date) cands.push({ ...u, title: u.title, start: u.date, end: u.endDate ?? null, approx: u.approx });
    }
    if (!cands.length) return null;
    const t = cands.map(c => ({
      ...c,
      s: parse(c.start),
      e: c.end ? new Date(parse(c.end).getTime() + DAY) : null
    }));
    const active = t.filter(c => c.s <= now && (!c.e || now < c.e)).sort((a, b) => b.s - a.s);
    if (active.length) return active[0];
    const ended = t.filter(c => c.e && c.e <= now).sort((a, b) => b.s - a.s);
    if (ended.length) return ended[0];
    return t.sort((a, b) => a.s - b.s)[0];
  };

  // Header: last-updated + staleness
  const updatedEl = document.getElementById("updated");
  const lastUpd = parse(data.lastUpdated);
  const updAge = Math.floor((now - lastUpd) / DAY);
  updatedEl.textContent = "Data refreshed " + data.lastUpdated + (updAge > 0 ? ` (${updAge}d ago)` : " (today)");

  // Warn only when the banner actually on display has ended (a real gap with no
  // started successor) — auto-advanced cards don't need a "data stale" nudge.
  const anyEnded = data.games.some(g => {
    const p = pickBanner(g);
    return p?.end && new Date(parse(p.end).getTime() + DAY) <= now;
  });
  if (updAge > 10 || anyEnded) {
    const stale = document.getElementById("stale");
    stale.style.display = "";
    stale.textContent = anyEnded
      ? "⚠ A banner has ended since the last refresh — data needs updating"
      : "⚠ Data is " + updAge + " days old — consider refreshing";
  }

  const grid = document.getElementById("grid");
  for (const g of data.games) {
    const card = document.createElement("div");
    card.className = "card";
    card.style.setProperty("--accent", g.accent || "#5a617a");

    const icon = g.icon ? `<img class="gicon" src="${g.icon}" alt="" onerror="this.remove()">` : "";
    let html = `<h2>${g.name} ${icon}<span class="ver">${g.version || ""}</span></h2>`;

    const pb = pickBanner(g);
    if (pb) {
      const start = parse(pb.start);
      const endKnown = Boolean(pb.end);
      const endOfDay = endKnown ? new Date(parse(pb.end).getTime() + DAY) : null;
      const daysLeft = endKnown ? Math.ceil((endOfDay - now) / DAY) : null;
      const total = endKnown ? endOfDay - start : null;
      const pct = endKnown ? Math.min(100, Math.max(0, ((now - start) / total) * 100)) : 100;

      let cls = endKnown ? "ok" : "unknown";
      let label = endKnown ? daysLeft + "d left" : "end unknown";
      let badge = "";
      if (now < start) { cls = "upcoming"; label = "starts in " + Math.ceil((start - now) / DAY) + "d"; }
      else if (endKnown && daysLeft <= 0) { cls = "ended"; label = "ended"; }
      else if (endKnown && daysLeft <= 3) { cls = "urgent"; label = daysLeft + "d left"; badge = `<span class="ending-badge">ENDING SOON</span>`; }
      else if (endKnown && daysLeft <= 7) { cls = "soon"; }
      const isNew = now >= start && (now - start) / DAY <= 3 && (!endKnown || daysLeft > 0);
      if (isNew) badge += ` <span class="new-badge">NEW</span>`;

      const barColor = cls === "urgent" ? "var(--red)" : cls === "soon" ? "var(--amber)" : cls === "ended" ? "var(--gray)" : cls === "upcoming" ? "#7fb4e8" : "var(--green)";
      const dateRange = endKnown ? `${fmt(pb.start)} → ${fmt(pb.end)}` : `${fmt(pb.start)} → End date unknown`;
      const barFill = endKnown
        ? `<div class="bar-fill" style="width:${pct}%;background:${barColor}"></div>`
        : `<div class="bar-fill unknown"></div>`;
      html += `
        <div class="banner" ${wishAttrs(pb)}>
          <div class="banner-title">${wishTitle(g, pb)} ${badge}</div>
          <div class="meta">
            <span>${dateRange}</span>
            <span class="days ${cls}">${label}</span>
          </div>
          <div class="bar">${barFill}</div>
        </div>`;
    }

    if (g.needsCheck) {
      html += `<div class="check">🔍 No tracked banner data — check manually via the links below.</div>`;
    }

    // Announced entries without dates stay here until a start date is confirmed.
    // Dated entries move to the bar above once their start date arrives.
    const futureUp = (g.upcoming || []).filter(u => !u.date || parse(u.date) > now);
    if (futureUp.length) {
      html += `<div class="upcoming"><h3>Upcoming</h3><ul>`;
      for (const u of futureUp) {
        const inDays = u.date ? Math.ceil((parse(u.date) - now) / DAY) : null;
        const when = u.date
          ? (u.approx ? "~" : "") + fmt(u.date) + (inDays > 0 ? ` (in ${inDays}d)` : "")
          : "Date TBA";
        html += `<li ${wishAttrs(u)}><span>${wishTitle(g, u)}</span><span class="when">${when}</span></li>`;
      }
      html += `</ul></div>`;
    }

    // Leaks are display-only: never candidates for promotion or calendar spans.
    if (!['P5X', 'GFL2', 'FGO'].includes(g.short) && g.leaks?.length) {
      html += `<div class="leaks"><h3>Leaked / Unconfirmed</h3><ul>`;
      for (const leak of g.leaks) {
        html += `<li ${wishAttrs(leak)}><span>${wishTitle(g, leak)}</span><div class="leak-meta">` +
          `<span>Rumoured for ${leak.version}</span>` +
          `<span class="confidence ${leak.confidence}" title="${leak.confidenceReason}">${leak.confidence[0].toUpperCase() + leak.confidence.slice(1)} confidence</span>` +
          `<a href="${leak.sourceUrl}" target="_blank" rel="noopener">Source ↗</a>` +
          `<span>Checked ${fmt(leak.checkedAt)}</span></div></li>`;
      }
      html += `</ul></div>`;
    }

    if ((g.links || []).length) {
      html += `<div class="links">` +
        g.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label} ↗</a>`).join("") +
        `</div>`;
    }

    card.innerHTML = html;
    grid.appendChild(card);
  }

  // ---- Calendar overview ----
  // Flat list of spans. Null ends remain explicitly open-ended; they are never
  // coerced into fake one-day calendar entries.
  const calItems = [];
  for (const g of data.games) {
    const accent = g.accent || "#5a617a";
    for (const b of (g.banners || []))
      calItems.push({ characterIds: b.characterIds, name: g.name, accent, title: b.title, start: parse(b.start), end: b.end ? parse(b.end) : null, banner: true, unknownEnd: !b.end });
    for (const u of (g.upcoming || []).filter(u => u.date))
      calItems.push({ characterIds: u.characterIds, name: g.name, accent, title: u.title, start: parse(u.date), end: u.endDate ? parse(u.endDate) : null, approx: u.approx, unknownEnd: !u.endDate });
  }

  const fmtD = d => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const textOn = hex => {
    const n = parseInt(hex.slice(1), 16);
    const lum = 0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255);
    return lum > 150 ? "#10131a" : "#fff";
  };
  const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const calEnd = it => it.end || (it.start <= todayMid ? todayMid : it.start);

  let calY = now.getFullYear(), calM = now.getMonth();
  const calSel = new Set(); // selected game names; empty = show all
  const calTitle = document.getElementById("cal-title");
  const weeksEl = document.getElementById("cal-weeks");

  const filtersEl = document.getElementById("cal-filters");
  filtersEl.innerHTML =
    `<button class="cal-filter active" type="button">All</button>` +
    data.games.map(g => {
      const accent = g.accent || "#5a617a";
      return `<button class="cal-filter" type="button" data-game="${g.name}" style="--chip:${accent}" title="${g.name}">` +
        `<span class="cal-dot" style="background:${accent}"></span>${g.short}</button>`;
    }).join("");
  filtersEl.addEventListener("click", e => {
    const btn = e.target.closest(".cal-filter");
    if (!btn) return;
    const game = btn.dataset.game;
    if (!game) calSel.clear();                 // "All" resets the selection
    else if (calSel.has(game)) calSel.delete(game);
    else calSel.add(game);
    filtersEl.querySelectorAll(".cal-filter").forEach(b =>
      b.classList.toggle("active", b.dataset.game ? calSel.has(b.dataset.game) : calSel.size === 0));
    renderCal();
  });

  function renderCal() {
    calTitle.textContent = new Date(calY, calM, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
    const first = new Date(calY, calM, 1);
    const last = new Date(calY, calM + 1, 0);
    const gridStart = new Date(calY, calM, 1 - first.getDay());            // back to Sunday
    const gridEnd = new Date(calY, calM, last.getDate() + 6 - last.getDay()); // forward to Saturday
    let html = "";
    for (let ws = new Date(gridStart); ws <= gridEnd; ws.setDate(ws.getDate() + 7)) {
      const weekStart = new Date(ws);
      const weekEnd = new Date(ws); weekEnd.setDate(weekEnd.getDate() + 6);
      // Reserve height for the unfiltered lane count so filtering never shifts the layout
      let lanes = 0;
      for (const it of calItems) {
        const drawEnd = calEnd(it);
        if (!(drawEnd < weekStart || it.start > weekEnd)) lanes++;
      }
      // 24px day-number row + 19px per lane + 5px padding + 1px border (border-box)
      html += `<div class="cal-week" style="min-height:${30 + lanes * 19}px">`;
      for (let i = 0; i < 7; i++) {
        const d = new Date(weekStart); d.setDate(d.getDate() + i);
        const cls = ["cal-daynum"];
        if (d.getMonth() !== calM) cls.push("other");
        if (d.getTime() === todayMid.getTime()) cls.push("today");
        html += `<div class="${cls.join(" ")}">${d.getDate()}</div>`;
      }
      let row = 2; // row 1 holds the day numbers; each bar gets its own lane below
      calItems.forEach((it, idx) => {
        if (calSel.size && !calSel.has(it.name)) return;
        if (document.getElementById('wish-only').checked && !wishlist.has(it)) return;
        const drawEnd = calEnd(it);
        if (drawEnd < weekStart || it.start > weekEnd) return;
        const s = it.start > weekStart ? it.start : weekStart;
        const e = drawEnd < weekEnd ? drawEnd : weekEnd;
        const col = Math.round((s - weekStart) / DAY) + 1;
        const colEnd = Math.round((e - weekStart) / DAY) + 2;
        const cls = ["cal-bar"];
        if (wishlist.has(it)) cls.push('wish-match');
        if (it.start >= weekStart) cls.push("starts");
        if (it.unknownEnd) cls.push("unknown-end");
        else if (it.end <= weekEnd) cls.push("ends");
        html += `<div class="${cls.join(" ")}" data-i="${idx}" ` +
          `style="grid-row:${row++};grid-column:${col}/${colEnd};background:${it.accent};color:${textOn(it.accent)}">` +
          `${wishlist.has(it) ? "★ " : ""}${it.unknownEnd ? "↝ " : ""}${it.approx ? "~" : ""}${it.title}</div>`;
      });
      html += `</div>`;
    }
    weeksEl.innerHTML = html;
  }
  renderCal();
  // Lock the weeks area to the current month's height so flipping to a
  // sparser month doesn't collapse the calendar (busier months can still grow)
  weeksEl.style.minHeight = weeksEl.offsetHeight + "px";

  document.getElementById("cal-prev").addEventListener("click", () => {
    calM--; if (calM < 0) { calM = 11; calY--; } renderCal();
  });
  document.getElementById("cal-next").addEventListener("click", () => {
    calM++; if (calM > 11) { calM = 0; calY++; } renderCal();
  });

  // Hover tooltip with the bar's full details
  const tooltip = document.getElementById("cal-tooltip");
  weeksEl.addEventListener("mouseover", e => {
    const bar = e.target.closest(".cal-bar");
    if (!bar) { tooltip.style.display = "none"; return; }
    const it = calItems[+bar.dataset.i];
    const dates = it.unknownEnd
      ? `${it.approx ? "~" : ""}${fmtD(it.start)} → End date unknown`
      : `${it.approx ? "~" : ""}${fmtD(it.start)} → ${fmtD(it.end)} · ${Math.round((it.end - it.start) / DAY) + 1} days`;
    tooltip.innerHTML =
      `<div class="tt-date">${dates}</div>` +
      `<div class="tt-row"><span class="cal-dot" style="background:${it.accent}"></span>` +
      `<span><strong>${it.name}</strong> · ${it.title}</span></div>`;
    tooltip.style.display = "block";
    const r = bar.getBoundingClientRect();
    let x = e.clientX - tooltip.offsetWidth / 2;
    x = Math.max(8, Math.min(x, window.innerWidth - tooltip.offsetWidth - 8));
    let y = r.top - tooltip.offsetHeight - 8;
    if (y < 8) y = r.bottom + 8;
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
  });
  weeksEl.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });

  function refreshWishlist() {
    const panel = document.getElementById('wish-list');
    const rows = window.GachaWishlist.timeline(data.games, wishlist.selected);
    const tabs = [
      { id: 'live', label: 'Live', rank: 0 },
      { id: 'soon', label: 'Soon', rank: 1 },
      { id: 'tba', label: 'TBA', rank: 2 }
    ].map(tab => ({ ...tab, count: rows.filter(row => row.rank === tab.rank).length }));
    const activeTab = tabs.find(tab => tab.id === wishlistTab) || tabs[0];
    const tabList = tabs.map(tab => `<button type="button" class="wish-tab" role="tab" id="wish-tab-${tab.id}" data-wish-tab="${tab.id}" aria-controls="wish-tabpanel" aria-selected="${tab.id === activeTab.id}" tabindex="${tab.id === activeTab.id ? '0' : '-1'}">${tab.label}<span class="wish-tab-count">${tab.count}</span></button>`).join('');
    const groups = [];
    rows.filter(row => row.rank === activeTab.rank).forEach(row => {
      let group = groups.find(item => item.game === row.game);
      if (!group) { group = { game: row.game, rows: [] }; groups.push(group); }
      group.rows.push(row);
    });
    const content = groups.map(group => {
      const characters = group.rows.map(row => {
        const tone = row.rank === 0 ? 'live' : row.rank === 1 ? 'scheduled' : '';
        const badge = row.rank === 0 ? '● Live' : row.rank === 1 ? `${row.approx ? '~' : ''}${fmt(row.date)}` : 'TBA';
        let detail = row.rank === 0 ? 'Banner live now' : row.rank === 1 ? `${fmt(row.date)} · in ${row.days} ${row.days === 1 ? 'day' : 'days'}` : 'Date TBA';
        if (row.approx) detail += ' · Estimated schedule';
        if (row.leak) detail += ' · Unconfirmed';
        return `<li class="wish-chip" title="${esc(detail)}">${wishStar(row.game, row.id)}<span class="wish-chip-name">${esc(row.name)}</span><span class="wish-chip-status ${tone}">${badge}</span></li>`;
      }).join('');
      const gameName = group.game.name || 'Unknown game';
      const gameIcon = group.game.icon ? `<img src="${esc(group.game.icon)}" alt="">` : '';
      return `<section class="wish-cluster" style="--accent:${esc(group.game.accent || '#5a617a')}" aria-label="${esc(gameName)} wishlist"><span class="wish-cluster-game" title="${esc(gameName)}">${gameIcon}${esc(group.game.short || gameName)}</span><ul class="wish-cluster-list">${characters}</ul></section>`;
    }).join('');
    const emptyLabel = activeTab.id === 'live' ? 'No wishlisted characters are live right now.' : activeTab.id === 'soon' ? 'No wishlisted characters have a scheduled banner.' : 'No wishlisted characters are waiting for a date.';
    panel.innerHTML = rows.length ? `<div class="wish-tabs" role="tablist" aria-label="Wishlist status">${tabList}</div><div id="wish-tabpanel" role="tabpanel" aria-labelledby="wish-tab-${activeTab.id}">${content ? `<div class="wish-clusters">${content}</div>` : `<p class="wish-tab-empty">${emptyLabel}</p>`}</div>` : '<p class="wish-empty-state"><strong>Your next favorite starts here</strong>Star a character below to follow their next banner.</p>';
    document.getElementById('wish-count').textContent = wishlist.selected.size;
    document.getElementById('wish-status').textContent = wishlist.warning;
    document.querySelectorAll('[data-wish-id]').forEach(button => {
      const selected = wishlist.selected.has(button.dataset.wishId);
      button.setAttribute('aria-pressed', String(selected));
      button.setAttribute('aria-label', `${selected ? 'Remove' : 'Add'} ${button.dataset.name} ${selected ? 'from' : 'to'} wishlist`);
      button.title = button.getAttribute('aria-label');
      button.textContent = selected ? '★' : '☆';
    });
    document.querySelectorAll('[data-wish-ids]').forEach(el => {
      el.classList.toggle('wish-match', wishlist.has({ characterIds: el.dataset.wishIds.split(' ') }));
    });
    let visible = 0;
    [...grid.children].forEach((card, index) => {
      const match = Object.keys(data.games[index].characters || {}).some(id => wishlist.selected.has(id));
      card.hidden = document.getElementById('wish-only').checked && !match;
      if (!card.hidden) visible++;
    });
    document.getElementById('wish-empty').hidden = visible > 0;
    renderCal();
  }
  document.addEventListener('click', event => {
    const tab = event.target.closest('[data-wish-tab]');
    if (tab) {
      wishlistTab = tab.dataset.wishTab;
      refreshWishlist();
      document.querySelector(`[data-wish-tab="${wishlistTab}"]`)?.focus();
      return;
    }
    const button = event.target.closest('[data-wish-id]');
    if (!button) return;
    const inPanel = document.getElementById('wish-list').contains(button);
    wishlist.toggle(button.dataset.wishId);
    refreshWishlist();
    if (inPanel) document.getElementById('wish-only').focus();
  });
  document.getElementById('wish-list').addEventListener('keydown', event => {
    const tab = event.target.closest('[data-wish-tab]');
    if (!tab || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
    const tabs = [...document.querySelectorAll('[data-wish-tab]')];
    const current = tabs.indexOf(tab);
    const next = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 : (current + (event.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
    event.preventDefault();
    tabs[next].click();
  });
  document.getElementById('wish-only').addEventListener('change', refreshWishlist);
  window.addEventListener('storage', event => {
    if (event.key === window.GachaWishlist.KEY || event.key === null) { wishlist.reload(); refreshWishlist(); }
  });
  refreshWishlist();
})();
</script>
</body>
</html>
